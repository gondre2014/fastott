<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - FastOTT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            letter-spacing: -0.02em;
        }
        body {
            background-color: #000000;
            background-image: radial-gradient(circle at 50% 30%, rgba(120, 120, 120, 0.12), transparent 70%);
        }
        .liquid-glass {
            background: rgba(22, 22, 24, 0.65);
            backdrop-filter: blur(40px) saturate(190%);
            -webkit-backdrop-filter: blur(40px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                inset 0 1px 0 0 rgba(255, 255, 255, 0.12),
                inset 0 0 16px 0 rgba(255, 255, 255, 0.02),
                0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        .apple-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .apple-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.07);
        }
        .apple-btn {
            background: #ffffff;
            color: #000000;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .apple-btn:hover {
            background: #e5e5ea;
            transform: scale(0.99);
        }
        .apple-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body class="text-[#f5f5f7] min-h-screen flex items-center justify-center p-6 selection:bg-white selection:text-black">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-2 mb-6">
                <div class="w-7 h-7 rounded-lg bg-white text-black font-semibold text-xs flex items-center justify-center">F</div>
                <span class="font-medium text-sm text-white/90">FastOTT</span>
            </a>
            <h2 class="text-2xl font-semibold text-white tracking-tight">계정 생성</h2>
            <p class="text-xs text-white/40 mt-1">간편 가입 후 주문 관리를 시작하세요</p>
        </div>

        <div class="liquid-glass rounded-2xl p-7">
            <form class="space-y-4" onsubmit="event.preventDefault(); alert('가입 처리 로직');">
                <div>
                    <label class="block text-[11px] text-white/50 mb-1.5 font-medium">성함 또는 닉네임</label>
                    <input type="text" required placeholder="홍길동" class="apple-input w-full rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-white/20">
                </div>

                <div>
                    <label class="block text-[11px] text-white/50 mb-1.5 font-medium">이메일</label>
                    <input type="email" required placeholder="user@fastott.shop" class="apple-input w-full rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-white/20">
                </div>

                <div>
                    <label class="block text-[11px] text-white/50 mb-1.5 font-medium">비밀번호</label>
                    <input type="password" required placeholder="8자 이상 입력" class="apple-input w-full rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-white/20">
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="terms" required class="rounded bg-white/5 border-white/20 text-white focus:ring-0 w-3.5 h-3.5">
                    <label for="terms" class="text-[11px] text-white/40 select-none">서비스 약관 및 디지털 상품 규정에 동의합니다.</label>
                </div>

                <button type="submit" class="apple-btn w-full mt-2 font-semibold py-3 rounded-xl text-xs">
                    계정 생성
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-white/[0.06] text-center">
                <span class="text-xs text-white/40">이미 계정이 있으신가요?</span>
                <a href="/login" class="text-xs text-white font-medium ml-1.5 hover:underline">로그인</a>
            </div>
        </div>
    </div>
</body>
</html>
