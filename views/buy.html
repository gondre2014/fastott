<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastOTT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            letter-spacing: -0.02em;
        }
        body {
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(120, 120, 120, 0.15), transparent 70%),
                radial-gradient(circle at 10% 80%, rgba(80, 80, 80, 0.08), transparent 50%);
        }
        .liquid-glass {
            background: rgba(22, 22, 24, 0.65);
            backdrop-filter: blur(40px) saturate(190%);
            -webkit-backdrop-filter: blur(40px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                inset 0 1px 0 0 rgba(255, 255, 255, 0.12),
                inset 0 0 16px 0 rgba(255, 255, 255, 0.02),
                0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
        .liquid-glass-sub {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }
        .glass-card-active {
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            background: rgba(35, 35, 38, 0.8) !important;
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.25) !important;
        }
        .apple-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .apple-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.07);
        }
        .apple-btn {
            background: #ffffff;
            color: #000000;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .apple-btn:hover { background: #e5e5ea; transform: scale(0.99); }
    </style>
</head>
<body class="text-[#f5f5f7] min-h-screen selection:bg-white selection:text-black">

    <header class="border-b border-white/[0.06] sticky top-0 z-50 bg-black/40 backdrop-blur-2xl">
        <div class="max-w-5xl mx-auto px-6 h-14 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2.5">
                <div class="w-6 h-6 rounded-md bg-white text-black font-semibold text-xs flex items-center justify-center tracking-tighter">F</div>
                <span class="font-medium text-sm tracking-tight text-white/90">FastOTT</span>
            </a>
            <div class="flex items-center gap-5">
                <a href="/dashbored" class="text-xs text-white/40 hover:text-white transition">관리자</a>
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-16">
        <div class="max-w-lg mb-12">
            <p class="text-xs font-mono text-white/40 uppercase tracking-widest mb-2">Checkout</p>
            <h1 class="text-3xl sm:text-4xl font-semibold tracking-tight text-white mb-3">구독 플랜 선택</h1>
            <p class="text-sm text-white/50 font-normal leading-relaxed">
                필요한 서비스를 선택하고 확인증을 첨부하시면 검증 후 전달됩니다.
            </p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- 실시간 동적 상품 리스트 -->
            <div class="lg:col-span-7 space-y-3" id="productsContainer">
                <div class="text-xs text-white/30 font-mono py-8">상품 로딩 중...</div>
            </div>

            <!-- 결제 패널 -->
            <div class="lg:col-span-5">
                <div class="liquid-glass rounded-2xl p-7 sticky top-24">
                    <div class="border-b border-white/[0.08] pb-5 mb-6 flex justify-between items-baseline">
                        <div>
                            <span class="text-[10px] font-mono text-white/40 uppercase tracking-wider block">Selected</span>
                            <h3 id="planTitle" class="text-sm font-medium text-white mt-0.5">-</h3>
                        </div>
                        <span id="planPrice" class="text-2xl font-semibold text-white tracking-tight">-</span>
                    </div>

                    <form id="orderForm" class="space-y-4">
                        <!-- 토스뱅크 계좌 정보 -->
                        <div class="liquid-glass-sub p-4 rounded-xl space-y-2">
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-white/40">입금 기관</span>
                                <span class="text-white/80 font-medium">토스뱅크</span>
                            </div>
                            <div class="flex justify-between items-center bg-black/40 p-2.5 rounded-lg border border-white/[0.05] text-xs font-mono">
                                <span class="text-white/90 select-all tracking-wider">1001-7021-4279</span>
                                <button type="button" onclick="navigator.clipboard.writeText('100170214279'); alert('계좌번호가 복사되었습니다.');" class="text-white/50 hover:text-white font-sans text-[11px] px-2 py-0.5 rounded transition">복사</button>
                            </div>
                            <div class="flex justify-between items-center text-[11px] text-white/40">
                                <span>예금주</span>
                                <span class="text-white/80 font-medium">금주헌</span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[11px] text-white/50 mb-1.5 font-medium">입금자 성함</label>
                            <input type="text" id="buyerName" required placeholder="실명 입력" class="apple-input w-full rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-white/20">
                        </div>

                        <div>
                            <label class="block text-[11px] text-white/50 mb-1.5 font-medium">수신 이메일</label>
                            <input type="email" id="buyerEmail" required placeholder="account@fastott.shop" class="apple-input w-full rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-white/20">
                        </div>

                        <div>
                            <label class="block text-[11px] text-white/50 mb-1.5 font-medium">이체 확인증</label>
                            <input type="file" id="receiptImage" accept="image/*" required class="apple-input w-full text-xs text-white/40 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[11px] file:font-medium file:bg-white/10 file:text-white hover:file:bg-white/20 rounded-xl p-2 cursor-pointer transition">
                        </div>

                        <button type="submit" id="submitBtn" class="apple-btn w-full mt-3 font-semibold py-3 rounded-xl text-xs">
                            주문 제출
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <script>
        let selectedProduct = null;

        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                const data = await res.json();
                const container = document.getElementById('productsContainer');

                if (!data.products || data.products.length === 0) {
                    container.innerHTML = '<div class="text-xs text-white/30 font-mono py-8">준비 중인 상품이 없습니다.</div>';
                    return;
                }

                container.innerHTML = data.products.map((p, idx) => `
                    <div onclick="selectProduct(${p.id}, '${p.name}', '${p.price}', ${p.stock}, this)" 
                         class="product-card ${idx === 0 ? 'glass-card-active' : ''} liquid-glass rounded-2xl p-5 cursor-pointer transition duration-300 hover:border-white/20">
                        <div class="flex items-center justify-between">
                            <div>
                                <span class="text-[11px] font-mono text-white/40 block mb-1">${p.category || 'OTT Service'}</span>
                                <h3 class="text-base font-medium text-white">${p.name}</h3>
                                <p class="text-xs text-white/45 mt-1">남은 재고: <span class="font-mono ${p.stock > 0 ? 'text-white/80' : 'text-red-400'}">${p.stock}개</span> · 30일 보증</p>
                            </div>
                            <div class="text-right">
                                <span class="text-lg font-semibold text-white tracking-tight">${p.price}</span>
                                <span class="block text-[11px] font-mono text-white/40 mt-0.5">/ 1개월</span>
                            </div>
                        </div>
                    </div>
                `).join('');

                if (data.products.length > 0) {
                    selectedProduct = data.products[0];
                    document.getElementById('planTitle').innerText = selectedProduct.name;
                    document.getElementById('planPrice').innerText = selectedProduct.price;
                }
            } catch (err) {
                console.error(err);
            }
        }

        function selectProduct(id, name, price, stock, el) {
            selectedProduct = { id, name, price, stock };
            document.getElementById('planTitle').innerText = name;
            document.getElementById('planPrice').innerText = price;

            document.querySelectorAll('.product-card').forEach(c => c.classList.remove('glass-card-active'));
            el.classList.add('glass-card-active');
        }

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!selectedProduct) return alert('상품을 먼저 선택해 주세요.');
            if (selectedProduct.stock <= 0) return alert('선택하신 상품의 재고가 소진되었습니다.');

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = '처리 중...';

            const formData = new FormData();
            formData.append('productId', selectedProduct.id);
            formData.append('productName', selectedProduct.name);
            formData.append('price', selectedProduct.price);
            formData.append('buyerName', document.getElementById('buyerName').value);
            formData.append('buyerEmail', document.getElementById('buyerEmail').value);
            formData.append('receiptImage', document.getElementById('receiptImage').files[0]);

            try {
                const res = await fetch('/api/order', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    alert('정상적으로 주문이 접수되었습니다.');
                    location.reload();
                } else {
                    alert('오류: ' + data.message);
                    btn.disabled = false;
                    btn.innerText = '주문 제출';
                }
            } catch (err) {
                alert('서버 연결 실패');
                btn.disabled = false;
                btn.innerText = '주문 제출';
            }
        });

        loadProducts();
    </script>
</body>
</html>
